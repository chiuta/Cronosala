name: teste
on:
  push:
  pull_request:
jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install opencv-python-headless zxing-cpp numpy
      - run: npm install
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
