name: teste
on:
  push:
  pull_request:
jobs:
  chrome:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: pip install opencv-python-headless zxing-cpp numpy
      - run: npm install
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
